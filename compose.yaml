# Run the whole app with Docker -- no local Ruby or PostgreSQL needed:
#
#   docker compose up                          # then open http://localhost:3000
#   docker compose run --rm web bin/rails test  # run the test suite
#
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      interval: 2s
      retries: 15

  web:
    image: ruby:3.4
    working_dir: /rails
    command: bash -c "bundle install && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres:
  bundle:
